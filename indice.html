<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Libro de Caja</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #07070f;
    --card-bg: rgba(255, 255, 255, 0.045);
    --card-bg-hover: rgba(255, 255, 255, 0.08);
    --border: rgba(255, 255, 255, 0.09);
    --border-hover: rgba(255, 255, 255, 0.22);
    --accent1: #8b5cf6;
    --accent2: #06b6d4;
    --accent3: #ec4899;
    --accent4: #f59e0b;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
    animation: float 18s ease-in-out infinite;
  }
  .bg-orb.one   { width: 520px; height: 520px; background: var(--accent1); top: -160px; left: -120px; }
  .bg-orb.two   { width: 460px; height: 460px; background: var(--accent2); bottom: -180px; right: -140px; animation-delay: -6s; }
  .bg-orb.three { width: 380px; height: 380px; background: var(--accent3); top: 40%; left: 55%; animation-delay: -12s; opacity: 0.35; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(40px, -40px) scale(1.08); }
    66%      { transform: translate(-30px, 30px) scale(0.95); }
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 64px 24px 96px;
  }

  .hero {
    text-align: center;
    margin-bottom: 64px;
    animation: fadeUp 0.8s ease both;
  }

  .badge {
    display: inline-block;
    padding: 8px 18px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 24px;
    backdrop-filter: blur(10px);
  }

  .hero h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2.4rem, 6vw, 4.5rem);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.03em;
    background: linear-gradient(120deg, #ffffff 20%, #a78bfa 50%, #22d3ee 80%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 20px;
  }

  .tagline {
    color: var(--text-muted);
    font-size: clamp(1rem, 2vw, 1.2rem);
    max-width: 620px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .tabs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 22px;
  }

  .tab-card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px 26px 24px;
    cursor: pointer;
    overflow: hidden;
    backdrop-filter: blur(14px);
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
                border-color 0.35s ease,
                background 0.35s ease,
                box-shadow 0.35s ease;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
    display: flex;
    flex-direction: column;
  }

  .tab-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 0%),
                rgba(139, 92, 246, 0.18), transparent 60%);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }

  .tab-card:hover {
    transform: translateY(-6px);
    border-color: var(--border-hover);
    background: var(--card-bg-hover);
    box-shadow: 0 24px 60px -20px rgba(139, 92, 246, 0.35);
  }
  .tab-card:hover::before { opacity: 1; }

  .tab-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    position: relative;
    z-index: 2;
  }

  .tab-icon {
    font-size: 2rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    transition: transform 0.35s ease;
    flex-shrink: 0;
  }
  .tab-card:hover .tab-icon { transform: scale(1.08) rotate(-4deg); }

  .tab-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.35rem;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: -0.01em;
    position: relative;
    z-index: 2;
  }

  .tab-subtitle {
    color: var(--text-muted);
    font-size: 0.95rem;
    line-height: 1.5;
    margin-bottom: 20px;
    flex: 1;
    position: relative;
    z-index: 2;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 10px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    cursor: pointer;
    text-decoration: none;
    color: var(--text);
    background: rgba(255, 255, 255, 0.04);
    transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
    font-family: inherit;
    position: relative;
    z-index: 2;
  }
  .btn:hover { border-color: var(--border-hover); background: rgba(255, 255, 255, 0.09); }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    border-color: transparent;
    color: #fff;
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, #7c4ff0, #0891b2);
    box-shadow: 0 10px 30px -10px rgba(139, 92, 246, 0.6);
  }

  .btn-sm {
    padding: 7px 12px;
    font-size: 0.76rem;
    border-radius: 10px;
    gap: 4px;
  }

  .btn-disabled {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: auto;
  }
  .btn-disabled:hover {
    background: rgba(255, 255, 255, 0.04);
    border-color: var(--border);
    box-shadow: none;
  }

  .btn-ghost { color: var(--accent2); }
  .btn-ghost span.arrow { transition: transform 0.3s ease; }
  .btn-ghost:hover span.arrow { transform: translateX(4px); }

  .btn-block { width: 100%; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(3, 3, 10, 0.72);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }
  .modal-overlay.active { opacity: 1; visibility: visible; }

  .modal {
    position: relative;
    width: 100%;
    max-width: 620px;
    max-height: 88vh;
    overflow-y: auto;
    background: linear-gradient(160deg, #12101f 0%, #0b0b16 100%);
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 44px 40px;
    box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8);
    transform: translateY(24px) scale(0.96);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease;
  }
  .modal-overlay.active .modal { transform: translateY(0) scale(1); opacity: 1; }

  .modal::-webkit-scrollbar { width: 8px; }
  .modal::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 8px; }

  .modal-close {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    font-size: 1.4rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.25s ease, transform 0.25s ease;
  }
  .modal-close:hover { background: rgba(255, 255, 255, 0.12); transform: rotate(90deg); }

  .modal-icon {
    font-size: 2.4rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 72px;
    height: 72px;
    border-radius: 20px;
    background: rgba(139, 92, 246, 0.15);
    border: 1px solid rgba(139, 92, 246, 0.3);
    margin-bottom: 22px;
  }

  .modal-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  .modal-subtitle {
    color: var(--text-muted);
    font-size: 1rem;
    margin-bottom: 28px;
  }

  .modal h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.82rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 12px;
    margin-top: 28px;
  }
  .modal h3:first-of-type { margin-top: 0; }

  .modal-content-text {
    color: #d5dae3;
    line-height: 1.7;
    font-size: 1rem;
  }

  .modal-steps {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
    counter-reset: step;
  }

  .modal-steps li {
    position: relative;
    padding-left: 36px;
    color: #d5dae3;
    line-height: 1.6;
    font-size: 0.96rem;
  }

  .modal-steps li::before {
    content: counter(step);
    counter-increment: step;
    position: absolute;
    left: 0;
    top: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-footer {
    display: flex;
    gap: 10px;
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .modal-footer .btn { flex: 1; min-width: 160px; padding: 12px 18px; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .page { padding: 40px 18px 72px; }
    .modal { padding: 36px 24px; border-radius: 22px; }
    .modal-title { font-size: 1.5rem; }
  }
</style>
</head>
<body>

  <div class="bg-orb one"></div>
  <div class="bg-orb two"></div>
  <div class="bg-orb three"></div>

  <div class="page">
    <header class="hero">
      <span class="badge">Índice</span>
      <h1 id="projectName">Libro de Caja</h1>
      <p class="tagline" id="projectTagline"></p>
    </header>

    <main class="tabs-grid" id="tabsGrid"></main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="Cerrar">&times;</button>
      <div class="modal-icon" id="modalIcon">📄</div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-subtitle" id="modalSubtitle"></p>

      <h3>Contenido de la sección</h3>
      <p class="modal-content-text" id="modalContent"></p>

      <h3>Cómo trabajar en esta sección</h3>
      <ul class="modal-steps" id="modalSteps"></ul>

      <div class="modal-footer">
        <button class="btn btn-ghost" id="modalCloseBtn">Volver</button>
        <a class="btn btn-primary" id="modalOpenPage" href="#">Abrir ↗</a>
      </div>
    </div>
  </div>

<script>
  /* =========================================================
     ⚙️  ZONA EDITABLE — cambia aquí todo el contenido
     ========================================================= */
  const projectData = {
    name: "Libro de Caja",
    tagline: "Sistema de registro y control de las operaciones de caja: arqueos, gastos, movimientos entre dependencias, bajas de expt, combustible, útiles, creación de firmas digitales y edición de bases de datos.",
    sections: [
      {
        icon: "🧾",
        title: "Arqueos de Caja",
        subtitle: "Conteo y verificación del efectivo en caja",
        url: "paginas/arqueo-caja.html",
        content: "Control de Caja es una aplicación web para llevar el control del efectivo de la empresa, registrar los vales de salida (dietas y pagos menores), hacer los arqueos de caja y generar los reembolsos del fondo. Toda la información se guarda en la nube (Supabase), de modo que no se pierde al cerrar el navegador y puede consultarse desde cualquier dispositivo con conexión.",
        steps: [
          "Realiza el conteo físico del efectivo por denominaciones (billetes y monedas).",
          "Registrar cada movimiento (entrada o salida de efectivo) con su número de vale.",
          "Compara el total contado con el saldo registrado en el libro de caja.",
          "Registra el arqueo en el formulario indicando fecha, hora y responsable.",
          "Generar el reembolso al fondo cuando se agota el efectivo.",
          "Documenta cualquier diferencia y su justificación en el apartado de observaciones.",
          "Firma el acta junto al custodio de la caja y adjunta el comprobante escaneado."
        ]
      },
      {
        icon: "📉",
        title: "Gastos Diferidos",
        subtitle: "Control y amortización de gastos diferidos de la empresa",
        url: "paginas/gastos-diferidos.html",
        content: "Aquí se registran los gastos pagados por anticipado que deben reconocerse como gasto en períodos futuros (seguros, alquileres, suscripciones, etc.). Incluye el registro del pago, su clasificación como diferido y el cálculo de la amortización mensual según el período de vigencia.",
        steps: [
          "Registra el pago del gasto diferido indicando, fecha y proveedor.",
          "Clasifica el tipo de gasto y define el período de amortización.",
          "Calcula la cuota mensual a reconocer como gasto (importe total ÷ meses).",
          "Actualiza la tabla de amortización al cierre de cada mes.",
          "Adjunta la documentación de respaldo (contrato o póliza)."
        ]
      },
      {
        icon: "🔄",
        title: "Operaciones entre Dependencias",
        subtitle: "Movimientos de fondos y transferencias internas",
        url: "paginas/O.P.html",
        content: "Registro de las operaciones donde el efectivo o los recursos se transfieren entre dependencias de la misma entidad: envíos de fondos, rendiciones, reembolsos internos y conciliaciones. Permite mantener trazabilidad de quién entrega, quién recibe y por qué concepto.",
        steps: [
          "Registra la dependencia de origen y la dependencia de destino.",
          "Indica el importe, la fecha y el concepto de la operación.",
          "Adjunta el comprobante de entrega firmado por ambas partes.",
          "Confirma la recepción del otro extremo para cerrar la operación.",
          "Verifica que los saldos de ambas dependencias queden conciliados."
        ]
      },
      {
        icon: "📁",
        title: "Expt de Baja",
        subtitle: "Expedientes de baja de útiles, bienes y activos",
        url: "paginas/expt-baja.html",
        content: "Expediente documental para dar de baja de útiles, bienes, activos o documentos por deterioro, obsolescencia, pérdida o fin de vida útil. Cada expediente incluye el inventario del bien, el dictamen técnico, la autorización del jefe de la dependencia y la resolución final que aprueba la baja.",
        steps: [
          "Identifica el bien o activo a dar de baja (número de inventario y descripción).",
          "Redacta el motivo de la baja (deterioro, pérdida, obsolescencia, etc.).",
          "Adjunta el dictamen técnico o evidencia fotográfica del estado.",
          "Solicita la autorización del jefe de la dependencia correspondiente.",
          "Archiva la resolución final y actualiza el inventario.",
          "Dentro de esta web solo se mantiene informacion de los expt no el expt como tal."
        ]
      },
      {
        icon: "⛽",
        title: "Combustible",
        subtitle: "Control de consumo y vales de combustible",
        url: "https://control-de-combustible.lovable.app/",
        content: "Registro y control del combustible asignado a vehículos y equipos: vales emitidos, consumo por unidad, kilometraje o horas de uso, y conciliación entre el combustible entregado y el consumo real. Permite detectar desviaciones y optimizar el gasto de combustible.",
        steps: [
          "Registra el vale de combustible indicando fecha, unidad y litros entregados.",
          "Permite el conocimiento de que vehículo opera cada tarjeta de combustible y su gasto real.",
          "Calcula el rendimiento (km recorridos ÷ litros consumidos).",
          "Compara el consumo real con el estándar permitido por vehículo.",
          "Permite el análisis estadístico del combustible de la empresa y su gasto en ambas monedas."
        ]
      },
      {
        icon: "🧰",
        title: "Útiles en Uso",
        subtitle: "Control de herramientas y Útiles en uso",
        url: "Utiles/index.html",
        content: "Control de los útiles, herramientas y materiales entregados a los trabajadores para el desempeño de sus funciones. Se registra a quién se le entrega cada bien, el estado en que se encuentra, la fecha de entrega y la fecha de devolución o reemplazo.",
        steps: [
          "Registra la entrega del útil indicando nombre del trabajador y área.",
          "Describe el bien, cantidad y estado en el momento de la entrega.",
          "Obtén la firma del trabajador como responsable del cuidado del útil.",
          "Actualiza el estado del útil al momento de la devolución o reemplazo.",
          "Reporta pérdidas o deterioros para su análisis y posible reposición.",
          "Permite la creación y llenado por completo del expediente de baja del útil."
        ]
      },
      {
        icon: "✍️",
        title: "Firmas",
        subtitle: "Aplicación para la creación de Firmas digitales",
        url: "paginas/firmas.html",
        content: "Sección destinada a la creación de las firmas digitales de las personas autorizadas para aprobar operaciones del libro de caja: jefes, custodios, contadores y demás responsables.",
        steps: [
          "Registra la firma ya sea desde una foto o documento.",
          "Permite la edición automática.",
          "Permite la edición manual para dar rasgos especificos."
        ]
      },
      {
        icon: "🛢️",
        title: "Editor de Bases de Datos",
        subtitle: "Edición de bases de datos de diferentes tipos y formatos",
        url: "https://format-flip-file-studio.lovable.app",
        content: "Esta aplicación web está diseñada para editar bases de datos de diferentes tipos y formatos. Permite abrir, visualizar y modificar el contenido de archivos de datos de distintos orígenes, transformarlos entre sí y gestionar registros de manera práctica directamente desde el navegador, sin necesidad de instalar software adicional.",
        steps: [
          "Accede a la aplicación desde el botón 'Abrir ↗'.",
          "Carga o arrastra el archivo de base de datos que deseas editar.",
          "Revisa el formato detectado y confirma la apertura o conversión.",
          "Edita los registros, campos o estructura según tus necesidades.",
          "Exporta o guarda el resultado en el formato deseado."
        ]
      }
    ]
  };
  /* =========================================================
     FIN DE LA ZONA EDITABLE
     ========================================================= */

  document.getElementById('projectName').textContent = projectData.name;
  document.getElementById('projectTagline').textContent = projectData.tagline;
  document.title = projectData.name + ' | Índice';

  const grid = document.getElementById('tabsGrid');
  projectData.sections.forEach((section, index) => {
    const card = document.createElement('article');
    card.className = 'tab-card';
    card.style.animationDelay = (index * 80) + 'ms';

    const pendiente = !section.url || section.url === '#';
    const abrirBtnClass = pendiente
      ? 'btn btn-primary btn-sm btn-disabled'
      : 'btn btn-primary btn-sm btn-open-page';
    const abrirBtnHref = pendiente ? '#' : section.url;
    const abrirBtnTitle = pendiente
      ? 'Esta sección aún no está disponible'
      : 'Abrir ' + section.title;
    const abrirBtnTexto = pendiente ? 'Próximamente' : 'Abrir ↗';

    card.innerHTML = `
      <div class="tab-header">
        <div class="tab-icon">${section.icon}</div>
        <a class="${abrirBtnClass}" href="${abrirBtnHref}" title="${abrirBtnTitle}">${abrirBtnTexto}</a>
      </div>
      <h2 class="tab-title">${section.title}</h2>
      <p class="tab-subtitle">${section.subtitle}</p>
      <button class="btn btn-ghost btn-block btn-open-modal" type="button">
        Ver reseña <span class="arrow">→</span>
      </button>
    `;

    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      card.style.setProperty('--mx', ((e.clientX - rect.left) / rect.width) * 100 + '%');
      card.style.setProperty('--my', ((e.clientY - rect.top) / rect.height) * 100 + '%');
    });

    card.querySelector('.btn-open-modal').addEventListener('click', (e) => {
      e.stopPropagation();
      openModal(section);
    });

    const abrirBtn = card.querySelector('.btn-open-page, .btn-disabled');
    abrirBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (pendiente) {
        e.preventDefault();
        alert('La sección "' + section.title + '" aún no está disponible.');
      }
    });

    grid.appendChild(card);
  });

  const overlay     = document.getElementById('modalOverlay');
  const closeBtn    = document.getElementById('modalClose');
  const closeFooter = document.getElementById('modalCloseBtn');
  const openPageBtn = document.getElementById('modalOpenPage');
  const elIcon      = document.getElementById('modalIcon');
  const elTitle     = document.getElementById('modalTitle');
  const elSub       = document.getElementById('modalSubtitle');
  const elContent   = document.getElementById('modalContent');
  const elSteps     = document.getElementById('modalSteps');

  function openModal(section) {
    elIcon.textContent    = section.icon;
    elTitle.textContent   = section.title;
    elSub.textContent     = section.subtitle;
    elContent.textContent = section.content;
    elSteps.innerHTML     = section.steps.map(s => `<li>${s}</li>`).join('');

    const pendiente = !section.url || section.url === '#';
    if (pendiente) {
      openPageBtn.href = '#';
      openPageBtn.textContent = 'Próximamente';
      openPageBtn.classList.add('btn-disabled');
    } else {
      openPageBtn.href = section.url;
      openPageBtn.textContent = 'Abrir ↗';
      openPageBtn.classList.remove('btn-disabled');
    }

    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    overlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  openPageBtn.addEventListener('click', (e) => {
    if (openPageBtn.classList.contains('btn-disabled')) {
      e.preventDefault();
      alert('Esta sección aún no está disponible.');
    }
  });

  closeBtn.addEventListener('click', closeModal);
  closeFooter.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
