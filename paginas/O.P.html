<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consolidado de Operaciones entre Dependencias de AGESP.SA</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  :root {
    --bg: #e8e8ec;
    --bg-soft: #f2f2f5;
    --card: #ffffff;
    --text: #1a1a2e;
    --text-muted: #52526b;
    --text-soft: #74748b;
    --border: #d4d4dc;
    --border-dark: #b8b8c4;
    --primary-dark: #2d2d44;
    --primary-hover: #1a1a2e;
    --section-bg: #ebebf0;
    --total-bg: #dcdce4;
    --input-bg: #f5f5f8;
    --accent: #6366f1;
    --accent-2: #ec4899;
    --accent-3: #f59e0b;
    --ok: #059669;
    --ok-bg: #d1fae5;
    --bad: #dc2626;
    --bad-bg: #fee2e2;
    --warn: #d97706;
    --warn-bg: #fef3c7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden; line-height: 1.5;
  }
  /* ===== ORBES ===== */
  .orbs-bg {
    position: fixed; inset: 0; z-index: -1;
    overflow: hidden; pointer-events: none;
  }
  .orb {
    position: absolute; border-radius: 50%;
    filter: blur(80px); opacity: 0.45;
    animation: float 22s ease-in-out infinite;
    will-change: transform;
  }
  .orb-1 { width:420px; height:420px; background: radial-gradient(circle,#a5b4fc,#6366f1); top:-120px; left:-120px; animation-duration:24s; }
  .orb-2 { width:380px; height:380px; background: radial-gradient(circle,#fbcfe8,#ec4899); top:35%; right:-100px; animation-duration:28s; animation-delay:-8s; }
  .orb-3 { width:320px; height:320px; background: radial-gradient(circle,#bae6fd,#0ea5e9); bottom:-60px; left:30%; animation-duration:26s; animation-delay:-14s; }
  .orb-4 { width:280px; height:280px; background: radial-gradient(circle,#fed7aa,#f59e0b); top:55%; left:5%; animation-duration:30s; animation-delay:-20s; }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    25% { transform: translate(50px,-70px) scale(1.1); }
    50% { transform: translate(-40px,50px) scale(0.94); }
    75% { transform: translate(30px,60px) scale(1.06); }
  }
  /* ===== TOPBAR ===== */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; padding: 12px 24px;
    background: rgba(255,255,255,0.78);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    font-weight: 800; font-size: 1rem; letter-spacing: 0.5px;
    color: var(--primary-dark);
    display: flex; align-items: center; gap: 8px; cursor: pointer;
  }
  .brand-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow: 0 0 8px rgba(99,102,241,0.6);
  }
  .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .topbar-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 0.85rem; font-weight: 600; cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s;
  }
  .topbar-btn:hover {
    background: var(--primary-dark); color: #fff;
    border-color: var(--primary-dark); transform: translateY(-1px);
  }
  .topbar-btn.accent {
    background: linear-gradient(135deg,var(--accent),var(--accent-2));
    color: #fff; border-color: transparent;
  }
  .topbar-btn.accent:hover { filter: brightness(1.1); transform: translateY(-1px); }
  /* ===== HERO ===== */
  .hero {
    text-align: center; padding: 60px 24px 30px;
    max-width: 960px; margin: 0 auto;
    position: relative; z-index: 1;
  }
  .hero h1 {
    font-size: clamp(1.9rem,5vw,3.4rem); font-weight: 900;
    line-height: 1.1; margin: 0 0 18px; letter-spacing: -0.02em;
    background: linear-gradient(120deg,#6366f1 0%,#ec4899 50%,#f59e0b 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    animation: gradientShift 8s ease infinite;
  }
  @keyframes gradientShift {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .hero-sub { font-size: clamp(1rem,2vw,1.15rem); color: var(--text); font-weight: 600; margin: 0 0 6px; }
  .hero-meta { font-size: 0.9rem; color: var(--text-muted); margin: 0; }
  .hero-meta strong { color: var(--primary-dark); }
  /* ===== CARDS ===== */
  .cards-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(250px,1fr));
    gap: 20px; padding: 20px 24px 80px; max-width: 1200px; margin: 0 auto;
  }
  .card {
    position: relative; background: var(--card);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 24px 22px 20px; cursor: pointer; overflow: hidden;
    box-shadow: 0 2px 12px rgba(30,30,46,0.05);
    transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
    opacity: 0; transform: translateY(24px);
    animation: cascadeIn 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
    contain: layout style;
  }
  @keyframes cascadeIn { to { opacity: 1; transform: translateY(0); } }
  .card::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle 240px at var(--mx,50%) var(--my,50%), rgba(99,102,241,0.18) 0%, transparent 70%);
    opacity: 0; transition: opacity 0.35s ease; pointer-events: none; z-index: 0;
  }
  .card:hover::before { opacity: 1; }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 40px rgba(30,30,46,0.14);
    border-color: var(--accent);
  }
  .card > * { position: relative; z-index: 1; }
  .card-icon {
    font-size: 2rem; width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg,rgba(99,102,241,0.1),rgba(236,72,153,0.1));
    border-radius: 12px; margin-bottom: 14px;
  }
  .card-title { font-size: 1.05rem; font-weight: 800; color: var(--text); margin: 0 0 4px; letter-spacing: 0.2px; }
  .card-subtitle { font-size: 0.82rem; color: var(--text-muted); margin: 0 0 16px; line-height: 1.4; }
  .card-cta { display: inline-flex; align-items: center; gap: 4px; font-size: 0.85rem; font-weight: 700; color: var(--accent); transition: gap 0.2s; }
  .card:hover .card-cta { gap: 8px; }
  .card-stats { background: linear-gradient(135deg,rgba(99,102,241,0.05),rgba(236,72,153,0.05)); border-color: rgba(99,102,241,0.3); }
  .card-stats .card-icon { background: linear-gradient(135deg,rgba(99,102,241,0.2),rgba(236,72,153,0.2)); }
  /* ===== MAIN/SHEET ===== */
  main { padding: 20px; position: relative; z-index: 1; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text-muted);
    font-size: 0.88rem; font-weight: 600; cursor: pointer;
    margin-bottom: 18px; transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .back-btn:hover { background: var(--primary-dark); color: #fff; border-color: var(--primary-dark); }
  .sheet { display: none; contain: content; }
  .sheet.active { display: block; }
  .sheet h2 { margin: 0 0 4px; color: var(--primary-dark); font-weight: 800; font-size: 1.4rem; }
  .sheet .sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 18px; }
  /* ===== TABLES ===== */
  table {
    border-collapse: collapse; width: 100%; background: var(--card);
    margin-bottom: 18px; box-shadow: 0 2px 12px rgba(30,30,46,0.06);
    border-radius: 8px; overflow: hidden;
  }
  th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; font-size: 0.88rem; color: var(--text); }
  th { background: var(--primary-dark); color: #fff; font-weight: 700; letter-spacing: 0.3px; font-size: 0.82rem; text-transform: uppercase; }
  td.num { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
  td input {
    width: 100%; border: 1px solid transparent; background: var(--input-bg);
    padding: 5px 8px; text-align: center;
    font-variant-numeric: tabular-nums; font-size: 0.88rem; font-weight: 600;
    color: var(--text); border-radius: 4px;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  td input:focus {
    outline: none; border-color: var(--accent);
    background: #fff; box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
  }
  table thead th:nth-child(2),
  table thead th:nth-child(3),
  table thead th:nth-child(4),
  table thead th:nth-child(5) { text-align: center; }
  tr.section-row td { background: var(--section-bg); font-weight: 700; color: var(--primary-dark); }
  tr.total-row td { background: var(--total-bg); font-weight: 700; }
  tr.result-row td { background: var(--primary-dark); color: #fff; font-weight: 700; }
  .ok { color: var(--ok); font-weight: 700; }
  .bad { color: var(--bad); font-weight: 700; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.3px; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .sign { margin-top: 8px; font-size: 0.85rem; color: var(--text-muted); }
  .sign td { border: none; padding: 4px 8px; color: var(--text); }
  /* ===== TOOLBAR ===== */
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar button {
    padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; font-size: 0.85rem; font-weight: 600;
    background: var(--card); color: var(--text);
    transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s;
  }
  .toolbar button:hover { background: var(--primary-dark); color: #fff; border-color: var(--primary-dark); transform: translateY(-1px); }
  .toolbar .warn { color: var(--bad); border-color: var(--bad); }
  .toolbar .warn:hover { background: var(--bad); color: #fff; }
  .cuadres-title {
    font-weight: 800; color: var(--primary-dark);
    margin: 22px 0 8px; font-size: 0.95rem;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .cuadres-title + table thead th:nth-child(2),
  .cuadres-title + table thead th:nth-child(3),
  .cuadres-title + table thead th:nth-child(4) { text-align: center; }
  .cuadres-title + table tbody td:nth-child(2) { text-align: center; }
  /* ===== STATS ===== */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(170px,1fr)); gap: 12px; margin-bottom: 22px; }
  .kpi { background: var(--card); border-radius: 10px; padding: 14px 18px; box-shadow: 0 2px 12px rgba(30,30,46,0.06); border-left: 4px solid var(--accent); }
  .kpi .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 700; }
  .kpi .value { font-size: 1.5rem; font-weight: 900; margin-top: 4px; color: var(--primary-dark); }
  .kpi.ok { border-left-color: var(--ok); }
  .kpi.bad { border-left-color: var(--bad); }
  .kpi.warn { border-left-color: var(--warn); }
  .pairs-container { display: flex; flex-direction: column; gap: 12px; }
  .pair-card {
    border-left: 5px solid #ccc; border-radius: 10px; padding: 14px 18px;
    box-shadow: 0 2px 12px rgba(30,30,46,0.05);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .pair-header { font-weight: 800; font-size: 0.95rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .pair-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .compare-table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.75); border-radius: 8px; overflow: hidden; box-shadow: none; margin-bottom: 0; }
  .compare-table th, .compare-table td { padding: 9px 12px; border: 1px solid rgba(0,0,0,0.08); font-size: 0.85rem; color: var(--text); }
  .compare-table thead th { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; text-align: center; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .compare-table tbody td.cc-pair { font-weight: 800; font-size: 0.8rem; background: rgba(0,0,0,0.02); }
  .compare-table tbody td.num { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
  .compare-table tbody td.diff { font-weight: 900; font-size: 0.95rem; }
  .success-panel { background: var(--ok-bg); border-left: 5px solid var(--ok); padding: 20px 24px; border-radius: 10px; color: #065f46; font-size: 0.95rem; line-height: 1.6; box-shadow: 0 2px 12px rgba(30,30,46,0.05); }
  .success-panel .big { font-size: 2rem; display: block; margin-bottom: 4px; }
  /* ===== MODAL ===== */
  dialog {
    border: none; border-radius: 14px; padding: 0;
    max-width: 640px; width: 92%;
    box-shadow: 0 25px 60px rgba(0,0,0,0.35);
    background: var(--card); color: var(--text); overflow: hidden;
  }
  dialog::backdrop { background: rgba(20,20,30,0.55); backdrop-filter: blur(3px); }
  .dialog-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; background: var(--primary-dark); color: #fff; }
  .dialog-header h2 { margin: 0; font-size: 1.05rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .dialog-close {
    background: transparent; border: none; color: #fff; font-size: 1.5rem;
    cursor: pointer; width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.2s; line-height: 1;
  }
  .dialog-close:hover { background: rgba(255,255,255,0.2); transform: rotate(90deg); }
  .dialog-body { padding: 20px 22px 22px; max-height: 75vh; overflow-y: auto; }
  dialog h3 { margin: 18px 0 8px; color: var(--primary-dark); font-size: 0.92rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 700; }
  .form-group input[type="text"] {
    width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.9rem; color: var(--text); background: var(--input-bg);
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .form-group input[type="text"]:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
  .firmante-group { background: var(--bg-soft); padding: 12px 14px; border-radius: 8px; margin-bottom: 10px; border-left: 3px solid var(--accent); }
  .firmante-group h4 { margin: 0 0 8px; font-size: 0.85rem; color: var(--primary-dark); font-weight: 800; }
  .firmante-group label { display: block; font-size: 0.82rem; margin-bottom: 6px; color: var(--text-muted); font-weight: 600; }
  .firmante-group input { width: 100%; padding: 6px 10px; border: 1px solid var(--border); border-radius: 5px; font-size: 0.85rem; background: #fff; color: var(--text); }
  .firmante-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
  .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .dialog-actions button {
    padding: 9px 20px; border: none; border-radius: 8px;
    font-size: 0.9rem; font-weight: 700; cursor: pointer;
    transition: all 0.2s;
  }
  .dialog-actions .primary { background: linear-gradient(135deg,var(--accent),var(--accent-2)); color: #fff; }
  .dialog-actions .primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .dialog-actions .secondary { background: var(--bg-soft); color: var(--primary-dark); }
  .dialog-actions .secondary:hover { background: var(--border); }
  /* ===== TOAST ===== */
  .toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--primary-dark); color: #fff;
    padding: 12px 20px; border-radius: 8px;
    font-size: 0.88rem; font-weight: 700;
    opacity: 0; transition: opacity 0.3s, transform 0.3s;
    pointer-events: none; z-index: 999;
    transform: translateY(10px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  /* ===== PRINT ===== */
  @media print {
    @page { size: letter portrait; margin: 1cm 1.1cm; }
    body { background: #fff; margin: 0; color: #000; }
    .orbs-bg, .topbar, .hero, .cards-grid, .back-btn,
    .toolbar, .no-print, .toast, dialog { display: none !important; }
    main { padding: 0; }
    .sheet { display: block !important; }
    body.printing-all .sheet { page-break-after: always; }
    body.printing-all .sheet:last-child { page-break-after: auto; }
    table { box-shadow: none; page-break-inside: avoid; margin-bottom: 12px; border-radius: 0; }
    th { background: var(--primary-dark) !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    tr.section-row td { background: var(--section-bg) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    tr.total-row td { background: var(--total-bg) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    tr.result-row td { background: var(--primary-dark) !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    td input { border: none !important; background: transparent !important; padding: 0 !important; text-align: center !important; }
    td.num { text-align: center !important; }
    .sign td { border: none !important; }
    h2, .sub { color: #000; }
    .sheet .sub { font-size: .85rem; }
    body::before {
      content: "Consolidado de Operaciones entre Dependencias de AGESP.SA — Cuentas 696-100 / 696-200";
      display: block; font-size: .78rem; color: #555;
      border-bottom: 1px solid #999; padding-bottom: 4px;
      margin-bottom: 10px; font-weight: 600;
    }
    .pair-card { page-break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .compare-table { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .kpi-grid { page-break-inside: avoid; }
    .success-panel { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  /* ===== RESPONSIVE ===== */
  @media (max-width: 640px) {
    .topbar { padding: 10px 14px; flex-wrap: wrap; }
    .brand { font-size: 0.9rem; }
    .topbar-btn { padding: 7px 10px; font-size: 0.78rem; }
    .topbar-btn .btn-label { display: none; }
    .hero { padding: 40px 18px 20px; }
    .cards-grid { padding: 12px 14px 60px; gap: 14px; }
    .card { padding: 20px 18px 16px; }
    main { padding: 12px; }
    th, td { padding: 6px 8px; font-size: 0.8rem; }
    .toolbar { gap: 6px; }
    .toolbar button { padding: 7px 12px; font-size: 0.8rem; }
    .orb { filter: blur(50px); opacity: 0.35; }
  }
  /* ===== ACCESIBILIDAD ===== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .orb { animation: none; }
    .hero h1 { animation: none; }
  }
</style>
</head>
<body>

<div class="orbs-bg" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>

<div class="topbar">
  <div class="brand" onclick="goHome()">
    <span class="brand-dot"></span>
    <span id="brandName">AGESP.SA</span>
  </div>
  <div class="topbar-actions">
    <button class="topbar-btn" onclick="openSettings()" title="Configuración">
      <span>⚙</span><span class="btn-label">Configuración</span>
    </button>
    <button class="topbar-btn" onclick="printAll()" title="Imprimir todo">
      <span>🖨</span><span class="btn-label">Imprimir todo</span>
    </button>
    <button class="topbar-btn" onclick="exportAll()" title="Exportar plantilla completa">
      <span>⬇</span><span class="btn-label">Exportar</span>
    </button>
    <button class="topbar-btn accent" onclick="triggerImport()" title="Importar plantilla">
      <span>⬆</span><span class="btn-label">Importar</span>
    </button>
  </div>
</div>

<main id="main"></main>

<input type="file" id="importFile" accept=".xlsx,.xls" style="display:none" onchange="handleImport(this)">

<dialog id="settingsDialog">
  <div class="dialog-header">
    <h2>⚙ Configuración</h2>
    <button class="dialog-close" onclick="document.getElementById('settingsDialog').close()" aria-label="Cerrar">×</button>
  </div>
  <div class="dialog-body">
    <div class="form-group">
      <label>Nombre de la empresa</label>
      <input type="text" id="cfgEmpresa" placeholder="AGESP.SA">
    </div>

/* =====================================================================
   CÁLCULO COMPARTIDO (antes duplicado en renderSheet y refreshCalc)
   ===================================================================== */
function computeValues(sheetKey) {
  const d = DATA[sheetKey];
  const hasTerritorio = d.territorio !== null && d.territorio !== undefined;
  const totalAgencias100 = sum(d.agencias, 'v100');
  const totalAgencias200 = sum(d.agencias, 'v200');
  const totalOtros100 = sum(d.otros, 'v100');
  const totalOtros200 = sum(d.otros, 'v200');

  let cuadre100 = 0, cuadre200 = 0;
  if (hasTerritorio) {
    cuadre100 = num(d.territorio.v100) + totalAgencias100;
    cuadre200 = num(d.territorio.v200) + totalAgencias200;
  } else if (sheetKey === 'SERVICIOS TECNICOS') {
    cuadre100 = num(d.dirGral.v100) + totalOtros100;
    cuadre200 = num(d.dirGral.v200) + totalOtros200;
  } else if (sheetKey === 'JEFT') {
    cuadre100 = totalOtros100;
    cuadre200 = totalOtros200;
  }

  let totalCuentas100, totalCuentas200;
  if (hasTerritorio) {
    totalCuentas100 = cuadre100 + num(d.dirGral.v100) + totalOtros100;
    totalCuentas200 = cuadre200 + num(d.dirGral.v200) + totalOtros200;
  } else {
    totalCuentas100 = cuadre100;
    totalCuentas200 = cuadre200;
  }

  return {
    hasTerritorio,
    totalAgencias100, totalAgencias200,
    totalOtros100, totalOtros200,
    cuadre100, cuadre200,
    totalCuentas100, totalCuentas200,
    dif100: totalCuentas100 - num(d.saldo100),
    dif200: totalCuentas200 - num(d.saldo200)
  };
}

/* =====================================================================
   REFRESH QUIRÚRGICO (sin re-render completo)
   ===================================================================== */
function refreshCalc(sheetKey) {
  const c = computeValues(sheetKey);
  const container = document.getElementById('main');
  if (!container) return;

  // Helper: actualiza textContent si el elemento existe
  const setTd = (key, val) => {
    const el = container.querySelector(`[data-calc="${key}"]`);
    if (el) el.textContent = fmt(val);
  };
  // Helper: actualiza con clase ok/bad
  const setTdWithClass = (key, val) => {
    const el = container.querySelector(`[data-calc="${key}"]`);
    if (el) {
      el.textContent = fmt(val);
      el.className = `num ${diffClass(val)}`;
    }
  };

  setTd('cuadre100', c.cuadre100);
  setTd('cuadre200', c.cuadre200);
  setTd('cuadreDiff', c.cuadre100 - c.cuadre200);

  setTd('totalAgencias100', c.totalAgencias100);
  setTd('totalAgencias200', c.totalAgencias200);
  setTd('totalAgenciasDiff', c.totalAgencias100 - c.totalAgencias200);

  setTd('totalOtros100', c.totalOtros100);
  setTd('totalOtros200', c.totalOtros200);
  setTd('totalOtrosDiff', c.totalOtros100 - c.totalOtros200);

  setTd('totalCuentas100', c.totalCuentas100);
  setTd('totalCuentas200', c.totalCuentas200);
  setTd('totalCuentasDiff', c.totalCuentas100 - c.totalCuentas200);

  setTdWithClass('dif100', c.dif100);
  setTdWithClass('dif200', c.dif200);

  // Refresca solo la tabla de cuadres
  const cw = container.querySelector('.cuadres-wrapper');
  if (cw) cw.innerHTML = renderCuadres(sheetKey);
}

function initCards() {
  const cards = document.querySelectorAll('.card');
  for (let i = 0; i < cards.length; i++) {
    const card = cards[i];
    card.style.animationDelay = (i * 0.08) + 's';

    // mousemove con rAF throttle
    card.addEventListener('mousemove', e => {
      if (card._raf) return;
      const x = e.clientX, y = e.clientY;
      card._raf = requestAnimationFrame(() => {
        const r = card.getBoundingClientRect();
        card.style.setProperty('--mx', (x - r.left) + 'px');
        card.style.setProperty('--my', (y - r.top) + 'px');
        card._raf = null;
      });
    });
    card.addEventListener('mouseleave', () => {
      card.style.setProperty('--mx', '50%');
      card.style.setProperty('--my', '50%');
    });
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        card.click();
      }
    });
  }
}

function renderSheet(sheetKey, active = true) {
  const d = DATA[sheetKey];

  const activeCls = active ? ' active' : '';

  let html = `<div class="sheet${activeCls}">

      <button onclick="exportSheet('${sheetKey}')">⬇ Exportar plantilla</button>
      <button class="warn" onclick="resetSheet()">↺ Restaurar valores</button>
    </div>
    <table>
      <thead><tr>
        <th style="width:34%">Concepto</th><th>C. Costo</th><th>696-100</th><th>696-200</th>
        ${showDiff ? '<th>Diferencia</th>' : ''}
      </tr></thead>

  html += `<tr class="section-row"><td>CUADRE DE LA REGION</td><td></td>
    <td class="num" data-calc="cuadre100">${fmt(c.cuadre100)}</td>
    <td class="num" data-calc="cuadre200">${fmt(c.cuadre200)}</td>
    ${showDiff ? `<td class="num" data-calc="cuadreDiff">${fmt(c.cuadre100-c.cuadre200)}</td>` : ''}</tr>`;

  if (c.hasTerritorio) {
    html += `<tr class="total-row"><td>TERRITORIO</td><td>${d.ccosto}</td>
      <td class="num"><input type="number" step="0.01" value="${d.territorio.v100}" onchange="setTerritorio('${sheetKey}','v100',this.value)"></td>
      <td class="num"><input type="number" step="0.01" value="${d.territorio.v200}" onchange="setTerritorio('${sheetKey}','v200',this.value)"></td>
      ${showDiff ? `<td class="num">${fmt(num(d.territorio.v100)-num(d.territorio.v200))}</td>` : ''}</tr>`;
  }

  if (d.agencias.length) {
    html += `<tr class="total-row"><td>TOTAL C. COSTO</td><td></td>
      <td class="num" data-calc="totalAgencias100">${fmt(c.totalAgencias100)}</td>
      <td class="num" data-calc="totalAgencias200">${fmt(c.totalAgencias200)}</td>
      ${showDiff ? `<td class="num" data-calc="totalAgenciasDiff">${fmt(c.totalAgencias100-c.totalAgencias200)}</td>` : ''}</tr>`;
    for (let i = 0; i < d.agencias.length; i++) {
      const a = d.agencias[i];
      html += `<tr><td>${a.nombre}</td><td>${a.cc}</td>
        <td class="num"><input type="number" step="0.01" value="${a.v100}" onchange="setAgencia('${sheetKey}',${i},'v100',this.value)"></td>
        <td class="num"><input type="number" step="0.01" value="${a.v200}" onchange="setAgencia('${sheetKey}',${i},'v200',this.value)"></td>
        ${showDiff ? `<td class="num">${fmt(num(a.v100)-num(a.v200))}</td>` : ''}</tr>`;
    }
  }

  if (!c.hasTerritorio && sheetKey === 'SERVICIOS TECNICOS') {
    html += `<tr class="total-row"><td>DIRECCION GENERAL</td><td>150</td>
      <td class="num"><input type="number" step="0.01" value="${d.dirGral.v100}" onchange="setDirGral('${sheetKey}','v100',this.value)"></td>
      <td class="num"><input type="number" step="0.01" value="${d.dirGral.v200}" onchange="setDirGral('${sheetKey}','v200',this.value)"></td>
      ${showDiff ? `<td class="num">${fmt(num(d.dirGral.v100)-num(d.dirGral.v200))}</td>` : ''}</tr>`;
  } else if (c.hasTerritorio) {
    html += `<tr class="section-row"><td>DIRECCION GENERAL</td><td>150</td>
      <td class="num"><input type="number" step="0.01" value="${d.dirGral.v100}" onchange="setDirGral('${sheetKey}','v100',this.value)"></td>
      <td class="num"><input type="number" step="0.01" value="${d.dirGral.v200}" onchange="setDirGral('${sheetKey}','v200',this.value)"></td>
      ${showDiff ? `<td class="num">${fmt(num(d.dirGral.v100)-num(d.dirGral.v200))}</td>` : ''}</tr>`;
  }

  for (let i = 0; i < d.otros.length; i++) {
    const o = d.otros[i];
    html += `<tr><td>${o.nombre}</td><td>${o.cc}</td>
      <td class="num"><input type="number" step="0.01" value="${o.v100}" onchange="setOtro('${sheetKey}',${i},'v100',this.value)"></td>
      <td class="num"><input type="number" step="0.01" value="${o.v200}" onchange="setOtro('${sheetKey}',${i},'v200',this.value)"></td>
      ${showDiff ? `<td class="num">${fmt(num(o.v100)-num(o.v200))}</td>` : ''}</tr>`;
  }

  html += `<tr class="total-row"><td>TOTAL OTROS TERRIT.</td><td></td>
    <td class="num" data-calc="totalOtros100">${fmt(c.totalOtros100)}</td>
    <td class="num" data-calc="totalOtros200">${fmt(c.totalOtros200)}</td>
    ${showDiff ? `<td class="num" data-calc="totalOtrosDiff">${fmt(c.totalOtros100-c.totalOtros200)}</td>` : ''}</tr>`;

  html += `<tr class="result-row"><td>TOTAL POR CUENTAS</td><td></td>
    <td class="num" data-calc="totalCuentas100">${fmt(c.totalCuentas100)}</td>
    <td class="num" data-calc="totalCuentas200">${fmt(c.totalCuentas200)}</td>
    ${showDiff ? `<td class="num" data-calc="totalCuentasDiff">${fmt(c.totalCuentas100-c.totalCuentas200)}</td>` : ''}</tr>`;

  html += `<tr class="total-row"><td>SALDO CUENTAS CONTAB.</td><td></td>
    <td class="num"><input type="number" step="0.01" value="${d.saldo100}" onchange="setSaldo('${sheetKey}','saldo100',this.value)"></td>
    <td class="num"><input type="number" step="0.01" value="${d.saldo200}" onchange="setSaldo('${sheetKey}','saldo200',this.value)"></td>
    ${showDiff ? `<td class="num">${fmt(num(d.saldo100)-num(d.saldo200))}</td>` : ''}</tr>`;

  html += `<tr class="result-row"><td>DIFERENCIA</td><td></td>
    <td class="num ${diffClass(c.dif100)}" data-calc="dif100">${fmt(c.dif100)}</td>
    <td class="num ${diffClass(c.dif200)}" data-calc="dif200">${fmt(c.dif200)}</td>
    ${showDiff ? '<td></td>' : ''}</tr>`;

  html += `</tbody></table>`;

  html += `<table class="sign">
    <tr><td>CERTIFICA: ______________________________</td><td>RECIBIDO POR: ______________________________</td></tr>
    <tr><td>${d.cert}</td><td>${d.recibido}</td></tr>
  </table>`;

  html += `<div class="cuadres-wrapper">${renderCuadres(sheetKey)}</div>`;
  html += `</div>`;
  return html;
}

/* =====================================================================
   CUADRES
   ===================================================================== */
function calcCuadre(sheetKey, r) {
  const d = DATA[sheetKey];
  const propio = getEntry(sheetKey, r.cc);
  const refItem = getEntry(r.ref, d.ccosto);
  return { v100: num(propio.v100) - num(refItem.v200), v200: num(propio.v200) - num(refItem.v100) };
}

function renderCuadres(sheetKey) {
  const rows = CUADRES_CONFIG[sheetKey] || [];
  let html = `<div class="cuadres-title">CUADRES (reciprocidad entre hojas)</div>
    <table><thead><tr><th>TERRITORIOS</th><th>C.C</th><th>696-100</th><th>696-200</th><th>Estado</th></tr></thead><tbody>`;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const {v100, v200} = calcCuadre(sheetKey, r);
    const ok = Math.abs(v100) < 0.01 && Math.abs(v200) < 0.01;
    html += `<tr><td>${r.terr}</td><td>${r.cc}</td>
      <td class="num ${diffClass(v100)}">${fmt(v100)}</td>
      <td class="num ${diffClass(v200)}">${fmt(v200)}</td>
      <td>${ok ? '<span class="badge ok">✓ OK</span>' : '<span class="badge bad">✗ Diferencia</span>'}</td></tr>`;
  }
  html += `</tbody></table>`;
  return html;
}

/* =====================================================================
   STATS
   ===================================================================== */
function renderStats(active = true) {
  const pairMap = {};
  for (const sheetKey in CUADRES_CONFIG) {
    const rows = CUADRES_CONFIG[sheetKey];
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      const key = sheetKey < r.ref ? sheetKey + '|' + r.ref : r.ref + '|' + sheetKey;
      if (!pairMap[key]) pairMap[key] = { from: sheetKey, to: r.ref };
    }
  }
  const pairList = [];
  for (const key in pairMap) {
    const g = pairMap[key];
    const ccFrom = DATA[g.from].ccosto, ccTo = DATA[g.to].ccosto;
    const ida = getEntry(g.from, ccTo), vuelta = getEntry(g.to, ccFrom);
    const ida100 = num(ida.v100), ida200 = num(ida.v200);
    const vuel100 = num(vuelta.v100), vuel200 = num(vuelta.v200);
    const dif100 = ida100 - vuel200, dif200 = ida200 - vuel100;
    const absMax = Math.max(Math.abs(dif100), Math.abs(dif200));
    pairList.push({ from: g.from, to: g.to, ccFrom, ccTo, ida100, ida200, vuel100, vuel200, dif100, dif200, absMax, ok: absMax < 0.01 });
  }
  pairList.sort((a, b) => {
    if (a.ok !== b.ok) return a.ok ? 1 : -1;
    return b.absMax - a.absMax;
  });

  const totalPairs = pairList.length;
  const badPairs = pairList.filter(g => !g.ok);
  const okPairs = pairList.filter(g => g.ok);
  const badCount = badPairs.length;
  const maxDiff = badCount ? badPairs[0].absMax : 0;
  let sumAbsDiff = 0;
  for (let i = 0; i < badPairs.length; i++) sumAbsDiff += badPairs[i].absMax;

  const PALETTE = [
    { border:'#dc2626', bg:'#fef2f2', text:'#991b1b', light:'#fee2e2' },
    { border:'#ea580c', bg:'#fff7ed', text:'#9a3412', light:'#ffedd5' },
    { border:'#ca8a04', bg:'#fefce8', text:'#854d0e', light:'#fef9c3' },
    { border:'#16a34a', bg:'#f0fdf4', text:'#14532d', light:'#dcfce7' },
    { border:'#0d9488', bg:'#f0fdfa', text:'#134e4a', light:'#ccfbf1' },
    { border:'#2563eb', bg:'#eff6ff', text:'#1e3a8a', light:'#dbeafe' },
    { border:'#7c3aed', bg:'#f5f3ff', text:'#5b21b6', light:'#ede9fe' },
    { border:'#db2777', bg:'#fdf2f8', text:'#9d174d', light:'#fce7f3' },
    { border:'#78350f', bg:'#fef3c7', text:'#78350f', light:'#fde68a' },
    { border:'#0f766e', bg:'#f0fdfa', text:'#134e4a', light:'#99f6e4' },
  ];

  const activeCls = active ? ' active' : '';
  let html = `<div class="sheet${activeCls}">
    <button class="back-btn no-print" onclick="goHome()">← Volver al inicio</button>
    <h2>📊 Estadísticas de Cuadre</h2>
    <div class="sub">Comparación por contraparte: IDA 696-100 ↔ VUELTA 696-200 · IDA 696-200 ↔ VUELTA 696-100</div>
    <div class="toolbar no-print">
      <button onclick="printSheet()">🖨 Imprimir estadísticas</button>
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Pares únicos</div><div class="value">${totalPairs}</div></div>
      <div class="kpi ok"><div class="label">✓ Cuadres OK</div><div class="value">${okPairs.length}</div></div>
      <div class="kpi ${badCount ? 'bad' : 'ok'}"><div class="label">✗ Con diferencia</div><div class="value">${badCount}</div></div>
      <div class="kpi ${badCount ? 'warn' : 'ok'}"><div class="label">Mayor diferencia</div><div class="value">${fmt(maxDiff)}</div></div>
    </div>`;

  if (badCount === 0) {
    html += `<div class="success-panel"><span class="big">✅</span><strong>¡Todo cuadra!</strong><br>
      Los ${totalPairs} pares entre hojas están balanceados. No hay territorios con diferencias pendientes.</div>`;
  } else {
    html += `<h3 style="color:var(--primary-dark); margin: 4px 0 12px; font-size:1rem;">⚠ Pares con diferencias (${badCount})</h3>
      <div class="pairs-container">`;
    for (let i = 0; i < badPairs.length; i++) {
      const g = badPairs[i];
      const c = PALETTE[i % PALETTE.length];
      html += `<div class="pair-card" style="border-left-color:${c.border}; background:${c.bg};">
        <div class="pair-header" style="color:${c.text};">
          <span class="pair-dot" style="background:${c.border};"></span>
          ${g.from} (${g.ccFrom}) ↔ ${g.to} (${g.ccTo})
        </div>
        <table class="compare-table">
          <thead><tr style="background:${c.light}; color:${c.text};">
            <th style="width:22%;">Comparación</th>
            <th style="width:26%;">➡ IDA · ${g.from} → ${g.to}</th>
            <th style="width:26%;">⬅ VUELTA · ${g.to} → ${g.from}</th>
            <th style="width:26%;">Diferencia</th>
          </tr></thead>
          <tbody>
            <tr>
              <td class="cc-pair" style="color:${c.text};">IDA 696-100<br>vs VUELTA 696-200</td>
              <td class="num">${fmt(g.ida100)}</td>
              <td class="num" style="background:${c.light}55;">${fmt(g.vuel200)}</td>
              <td class="num diff" style="color:${c.text};">${fmt(g.dif100)}</td>
            </tr>
            <tr>
              <td class="cc-pair" style="color:${c.text};">IDA 696-200<br>vs VUELTA 696-100</td>
              <td class="num">${fmt(g.ida200)}</td>
              <td class="num" style="background:${c.light}55;">${fmt(g.vuel100)}</td>
              <td class="num diff" style="color:${c.text};">${fmt(g.dif200)}</td>
            </tr>
          </tbody>
        </table>
      </div>`;
    }
    html += `</div>
      <div style="background:var(--warn-bg); border-left:4px solid var(--warn); padding:14px 18px; border-radius:8px; font-size:.85rem; color:#78350f; line-height:1.6; margin-top:16px;">
        <strong>Resumen:</strong> ${badCount} par(es) con diferencia · Suma de magnitudes: <strong>${fmt(sumAbsDiff)}</strong>
        <br><strong>Cómo leer:</strong> en cada fila se compara la cuenta de la IDA contra la cuenta <em>contraria</em> de la VUELTA (100 contra 200 y viceversa). La diferencia = valor IDA − valor VUELTA de la contraparte. Los ${okPairs.length} pares restantes están balanceados y no se listan.
      </div>`;
  }
  html += `</div>`;
  return html;
}

/* =====================================================================
   SETTERS OPTIMIZADOS (surgical update)
   ===================================================================== */
function updateCell(sk) {
  saveDataDebounced();
  // Si la columna diferencia está visible, hay más celdas a actualizar → full re-render
  // (los diffs por fila de agencias/otros solo se recalculan con re-render)
  if (CONFIG.showDiffCol) {
    rerender(sk);
  } else {
    refreshCalc(sk);
  }
}

function setTerritorio(sk,k,v){ DATA[sk].territorio[k] = num(v); updateCell(sk); }
function setAgencia(sk,i,k,v){ DATA[sk].agencias[i][k] = num(v); updateCell(sk); }
function setOtro(sk,i,k,v){ DATA[sk].otros[i][k] = num(v); updateCell(sk); }
function setDirGral(sk,k,v){ DATA[sk].dirGral[k] = num(v); updateCell(sk); }
function setSaldo(sk,k,v){ DATA[sk][k] = num(v); updateCell(sk); }

function resetSheet(){
  if(!confirm('¿Restaurar TODOS los datos a los valores originales del archivo? (se recargará la página)')) return;
  localStorage.removeItem(STORAGE_KEY);
  savePending = false;
  clearTimeout(saveTimer);
  location.reload();
}

const settingsDialog = document.getElementById('settingsDialog');

function openSettings(){
  document.getElementById('cfgEmpresa').value = CONFIG.empresa;
  document.getElementById('cfgPeriodo').value = CONFIG.periodo;
  document.getElementById('cfgShowDiff').checked = CONFIG.showDiffCol;
  // Construir form de firmantes con UNA sola asignación innerHTML (antes era O(n²))
  const fc = document.getElementById('cfgFirmantes');
  let html = '';
  for (const k in DATA) {
    const d = DATA[k];
    html += `<div class="firmante-group">
      <h4>${d.icon || ''} ${d.nombre}</h4>
      <label>Certifica: <input type="text" data-sheet="${k}" data-field="cert" value="${d.cert.replace(/"/g,'&quot;')}"></label>
      <label>Recibido por: <input type="text" data-sheet="${k}" data-field="recibido" value="${d.recibido.replace(/"/g,'&quot;')}"></label>
    </div>`;
  }
  fc.innerHTML = html;
  settingsDialog.showModal();
}

settingsDialog.addEventListener('click', e => {
  const r = settingsDialog.getBoundingClientRect();
  const outside = (
    e.clientX < r.left || e.clientX > r.right ||
    e.clientY < r.top  || e.clientY > r.bottom
  );
  if (outside) settingsDialog.close();
});

function applySettings(){
  CONFIG.empresa = document.getElementById('cfgEmpresa').value.trim() || 'AGESP.SA';
  CONFIG.periodo = document.getElementById('cfgPeriodo').value.trim();
  CONFIG.showDiffCol = document.getElementById('cfgShowDiff').checked;
  document.querySelectorAll('#cfgFirmantes input').forEach(inp => {
    DATA[inp.dataset.sheet][inp.dataset.field] = inp.value;
  });
  saveDataNow();
  saveConfig();
  updateBrand();
  settingsDialog.close();
  rerender(currentSheet);
  showToast('✓ Configuración guardada');
}

function printSheet(){
  document.body.classList.remove('printing-all');
  window.print();
}
function printAll(){
  const prevView = currentSheet;
  const allSheets = Object.keys(DATA).map(k => renderSheet(k, false)).join('');
  document.getElementById('main').innerHTML = allSheets;
  document.body.classList.add('printing-all');

  }, 100);
}

let currentSheet = 'HOME';

  const main = document.getElementById('main');
  if (sk === 'HOME') {
    renderHome();
  } else if (sk === 'ESTADISTICAS') {
    main.innerHTML = renderStats(true);

  }

}

/* =====================================================================
   EXPORTACIÓN EXCEL
   ===================================================================== */
const BORDER = {
  top:    { style:'thin', color:{argb:'FFB0B7BF'} },
  left:   { style:'thin', color:{argb:'FFB0B7BF'} },
  bottom: { style:'thin', color:{argb:'FFB0B7BF'} },
  right:  { style:'thin', color:{argb:'FFB0B7BF'} }
};

function styleHeaderRow(ws, row, cols, opts) {
  for (let c = 1; c <= cols; c++) {
    const cell = ws.getCell(row, c);
    cell.border = BORDER;
    cell.font = Object.assign({ size: 11 }, opts.font || {});
    if (opts.fill) cell.fill = { type:'pattern', pattern:'solid', fgColor: { argb: opts.fill } };
    if (c >= 3) { cell.numFmt = '#,##0.00'; cell.alignment = { horizontal:'center', vertical:'middle' }; }
    else { cell.alignment = { horizontal:'left', vertical:'middle' }; }
  }
}

function buildSheet(wb, sk) {
  const d = DATA[sk];
  const ws = wb.addWorksheet(sk);
  ws.columns = [{width:38},{width:10},{width:22},{width:22}];

  let r = 1;
  ws.getCell(r,1).value = 'Consolidado de Operaciones entre Dependencias de ' + CONFIG.empresa;
  ws.mergeCells(r,1,r,4);
  ws.getCell(r,1).font = { bold:true, size:14, color:{argb:'FF1A1A2E'} };
  ws.getCell(r,1).alignment = { horizontal:'center', vertical:'middle' };
  ws.getRow(r).height = 26;
  r++;
  ws.getCell(r,1).value = d.subtitulo + ' · C. Costo ' + d.ccosto;
  ws.mergeCells(r,1,r,4);
  ws.getCell(r,1).font = { size:11, color:{argb:'FF52526B'} };
  ws.getCell(r,1).alignment = { horizontal:'center' };
  r++;
  ws.getCell(r,1).value = CONFIG.periodo ? 'Período: ' + CONFIG.periodo : 'Cuentas 696-100 / 696-200';
  ws.mergeCells(r,1,r,4);
  ws.getCell(r,1).font = { size:10, color:{argb:'FF74748B'} };
  ws.getCell(r,1).alignment = { horizontal:'center' };
  r += 2;

  ['AGENCIAS','C. COSTO','696-100','696-200'].forEach((h,i)=>{
    const c = ws.getCell(r, i+1);
    c.value = h;
    c.font = { bold:true, color:{argb:'FFFFFFFF'}, size:11 };
    c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF2D2D44'} };
    c.border = BORDER;
    c.alignment = { horizontal: i===0?'left':'center', vertical:'middle' };
  });
  ws.getRow(r).height = 22;
  r++;

  const cuadreRow = r; r++;

  let territorioRow = null;
  if (d.territorio) {
    territorioRow = r;
    ws.getCell(r,1).value = 'TERRITORIO';
    ws.getCell(r,2).value = d.ccosto;
    ws.getCell(r,3).value = d.territorio.v100;
    ws.getCell(r,4).value = d.territorio.v200;
    ws.getCell(r,3).protection = { locked:false };
    ws.getCell(r,4).protection = { locked:false };
    styleHeaderRow(ws, r, 4, { font:{bold:true}, fill:'FFDCDCE4' });
    r++;
  }

  let totalCostoRow = null, agenciasStart = null, agenciasEnd = null;
  if (d.agencias.length) {
    totalCostoRow = r; r++;
    agenciasStart = r;
    for (const a of d.agencias) {
      ws.getCell(r,1).value = a.nombre;
      ws.getCell(r,2).value = a.cc;
      ws.getCell(r,3).value = a.v100;
      ws.getCell(r,4).value = a.v200;
      ws.getCell(r,3).protection = { locked:false };
      ws.getCell(r,4).protection = { locked:false };
      styleHeaderRow(ws, r, 4, { font:{size:10} });
      r++;
    }
    agenciasEnd = r - 1;
  }

  let dirGralRow = null;
  if (d.territorio || sk === 'SERVICIOS TECNICOS') {
    dirGralRow = r;
    ws.getCell(r,1).value = 'DIRECCION GENERAL';
    ws.getCell(r,2).value = '150';
    ws.getCell(r,3).value = d.dirGral.v100;
    ws.getCell(r,4).value = d.dirGral.v200;
    ws.getCell(r,3).protection = { locked:false };
    ws.getCell(r,4).protection = { locked:false };
    styleHeaderRow(ws, r, 4, { font:{bold:true}, fill:'FFEBEBF0' });
    r++;
  }

  const otrosStart = r;
  for (const o of d.otros) {
    ws.getCell(r,1).value = o.nombre;
    ws.getCell(r,2).value = o.cc;
    ws.getCell(r,3).value = o.v100;
    ws.getCell(r,4).value = o.v200;
    ws.getCell(r,3).protection = { locked:false };
    ws.getCell(r,4).protection = { locked:false };
    styleHeaderRow(ws, r, 4, { font:{size:10} });
    r++;
  }
  const otrosEnd = r - 1;

  const totalOtrosRow = r;
  ws.getCell(r,1).value = 'TOTAL OTROS TERRIT.';
  ws.getCell(r,3).value = { formula:`SUM(C${otrosStart}:C${otrosEnd})` };
  ws.getCell(r,4).value = { formula:`SUM(D${otrosStart}:D${otrosEnd})` };
  styleHeaderRow(ws, r, 4, { font:{bold:true}, fill:'FFDCDCE4' });
  r++;

  const totalCuentasRow = r;
  ws.getCell(r,1).value = 'TOTAL POR CUENTAS';
  styleHeaderRow(ws, r, 4, { font:{bold:true, color:{argb:'FFFFFFFF'}}, fill:'FF2D2D44' });
  r++;

  const saldoRow = r;
  ws.getCell(r,1).value = 'SALDO CUENTAS CONTAB.';
  ws.getCell(r,3).value = d.saldo100;
  ws.getCell(r,4).value = d.saldo200;
  ws.getCell(r,3).protection = { locked:false };
  ws.getCell(r,4).protection = { locked:false };
  styleHeaderRow(ws, r, 4, { font:{bold:true}, fill:'FFDCDCE4' });
  r++;

  const difRow = r;
  ws.getCell(r,1).value = 'DIFERENCIA';
  ws.getCell(r,3).value = { formula:`C${totalCuentasRow}-C${saldoRow}` };
  ws.getCell(r,4).value = { formula:`D${totalCuentasRow}-D${saldoRow}` };
  styleHeaderRow(ws, r, 4, { font:{bold:true, color:{argb:'FFFFFFFF'}}, fill:'FF2D2D44' });
  r += 2;

  ws.getCell(r,1).value = 'CERTIFICA: ______________________________';
  ws.getCell(r,3).value = 'RECIBIDO POR: ______________________________';
  ws.mergeCells(r,3,r,4);
  r++;
  ws.getCell(r,1).value = d.cert;
  ws.getCell(r,3).value = d.recibido;
  ws.mergeCells(r,3,r,4);

  let cF100, cF200;
  if (d.territorio) {
    cF100 = `C${territorioRow}+C${totalCostoRow}`;
    cF200 = `D${territorioRow}+D${totalCostoRow}`;
  } else if (sk === 'SERVICIOS TECNICOS') {
    cF100 = `C${dirGralRow}+C${totalOtrosRow}`;
    cF200 = `D${dirGralRow}+D${totalOtrosRow}`;
  } else {
    cF100 = `C${totalOtrosRow}`;
    cF200 = `D${totalOtrosRow}`;
  }
  ws.getCell(cuadreRow,1).value = 'CUADRE DE LA REGION';
  ws.getCell(cuadreRow,3).value = { formula:cF100 };
  ws.getCell(cuadreRow,4).value = { formula:cF200 };
  styleHeaderRow(ws, cuadreRow, 4, { font:{bold:true}, fill:'FFEBEBF0' });

  if (totalCostoRow) {
    ws.getCell(totalCostoRow,1).value = 'TOTAL C. COSTO';
    ws.getCell(totalCostoRow,3).value = { formula:`SUM(C${agenciasStart}:C${agenciasEnd})` };
    ws.getCell(totalCostoRow,4).value = { formula:`SUM(D${agenciasStart}:D${agenciasEnd})` };
    styleHeaderRow(ws, totalCostoRow, 4, { font:{bold:true}, fill:'FFDCDCE4' });
  }

  let tp100, tp200;
  if (d.territorio) {
    tp100 = `C${cuadreRow}+C${dirGralRow}+C${totalOtrosRow}`;
    tp200 = `D${cuadreRow}+D${dirGralRow}+D${totalOtrosRow}`;
  } else {
    tp100 = `C${cuadreRow}`;
    tp200 = `D${cuadreRow}`;
  }
  ws.getCell(totalCuentasRow,3).value = { formula:tp100 };
  ws.getCell(totalCuentasRow,4).value = { formula:tp200 };

  ws.protect('', {
    selectLockedCells:true, selectUnlockedCells:true,
    formatCells:false, formatColumns:false, formatRows:false,
    insertColumns:false, insertRows:false,
    deleteColumns:false, deleteRows:false
  });
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

async function exportSheet(sk) {
  try {
    const wb = new ExcelJS.Workbook();
    wb.creator = 'AGESP.SA';
    buildSheet(wb, sk);
    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    downloadBlob(blob, `AGESP_${sk}_plantilla.xlsx`);
    showToast('✓ Plantilla de ' + sk + ' exportada');
  } catch (e) { alert('Error al exportar: ' + e.message); }
}

async function exportAll() {
  try {
    const wb = new ExcelJS.Workbook();
    wb.creator = 'AGESP.SA';
    Object.keys(DATA).forEach(sk => buildSheet(wb, sk));
    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    downloadBlob(blob, 'AGESP_plantilla_completa.xlsx');
    showToast('✓ Plantilla completa exportada');
  } catch (e) { alert('Error al exportar: ' + e.message); }
}

   ===================================================================== */
function triggerImport() { document.getElementById('importFile').click(); }

function getNumericValue(cell) {
  if (!cell || cell.value === null || cell.value === undefined) return null;
  const v = cell.value;
  if (typeof v === 'number') return v;
  if (typeof v === 'string') {
    const n = parseFloat(v.replace(/,/g,'').trim());
    return isNaN(n) ? null : n;
  }
  if (typeof v === 'object') {
    if (v.result !== undefined && v.result !== null) {
      const n = parseFloat(v.result);
      return isNaN(n) ? null : n;
    }
    if (v.richText) {
      const s = v.richText.map(t => t.text).join('');
      const n = parseFloat(s.replace(/,/g,'').trim());
      return isNaN(n) ? null : n;
    }
  }
  return null;
}

async function handleImport(input) {
  const file = input.files[0];
  if (!file) return;
  try {
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(await file.arrayBuffer());
    let updatedSheets = 0, updatedValues = 0;
    wb.eachSheet(ws => {
      const sk = ws.name;
      if (!DATA[sk]) return;
      const d = DATA[sk];
      let thisSheetUpdates = 0;
      ws.eachRow(row => {
        const label = String(row.getCell(1).value || '').trim();
        const cc = String(row.getCell(2).value || '').trim();
        if (label === 'TERRITORIO' && d.territorio) {
          const a = getNumericValue(row.getCell(3));
          const b = getNumericValue(row.getCell(4));
          if (a !== null) d.territorio.v100 = a;
          if (b !== null) d.territorio.v200 = b;
          if (a !== null || b !== null) thisSheetUpdates++;
        }
        else if (label === 'DIRECCION GENERAL') {
          const a = getNumericValue(row.getCell(3));
          const b = getNumericValue(row.getCell(4));
          if (a !== null) d.dirGral.v100 = a;
          if (b !== null) d.dirGral.v200 = b;
          if (a !== null || b !== null) thisSheetUpdates++;
        }
        else if (label === 'SALDO CUENTAS CONTAB.') {
          const a = getNumericValue(row.getCell(3));
          const b = getNumericValue(row.getCell(4));
          if (a !== null) d.saldo100 = a;
          if (b !== null) d.saldo200 = b;
          if (a !== null || b !== null) thisSheetUpdates++;
        }
        else if (cc) {
          const ag = d.agencias.find(x => x.cc === cc);
          if (ag) {
            const a = getNumericValue(row.getCell(3));
            const b = getNumericValue(row.getCell(4));
            if (a !== null) ag.v100 = a;
            if (b !== null) ag.v200 = b;
            if (a !== null || b !== null) thisSheetUpdates++;
          } else {
            const ot = d.otros.find(x => x.cc === cc);
            if (ot) {
              const a = getNumericValue(row.getCell(3));
              const b = getNumericValue(row.getCell(4));
              if (a !== null) ot.v100 = a;
              if (b !== null) ot.v200 = b;
              if (a !== null || b !== null) thisSheetUpdates++;
            }
          }
        }
      });
      if (thisSheetUpdates > 0) { updatedSheets++; updatedValues += thisSheetUpdates; }
    });

    if (updatedSheets === 0) {
      alert('No se encontraron hojas compatibles en el archivo. Asegúrese de importar una plantilla exportada desde esta aplicación.');
    } else {
      saveDataNow();
      rerender(currentSheet);
      showToast(`✓ Importado: ${updatedValues} valores en ${updatedSheets} hoja(s)`);
    }
  } catch (e) { alert('Error al importar: ' + e.message); }
  input.value = '';
}

   ===================================================================== */
Nube.init({
  modulo: 'operaciones',
  datos: () => ({ DATA, CONFIG }),
  alRecibir: (datos) => {
    if (!datos) return;
    if (datos.DATA) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(datos.DATA)); } catch (e) {}
      Object.assign(DATA, datos.DATA);
    } else if (typeof datos === 'object' && !datos.CONFIG) {
      // Compatibilidad con formato antiguo donde solo venía DATA
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(datos)); } catch (e) {}
      Object.assign(DATA, datos);
    }
    if (datos.CONFIG) {
      try { localStorage.setItem(CONFIG_KEY, JSON.stringify(datos.CONFIG)); } catch (e) {}
      Object.assign(CONFIG, datos.CONFIG);
    }
    updateBrand();
    rerender(currentSheet);
  }
});
